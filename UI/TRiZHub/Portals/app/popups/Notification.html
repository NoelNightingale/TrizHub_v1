<div class="modal-header {{app.setting.theme.info}}">
    <h4 class="modal-title">{{popupModel.header}}</h4>
</div>

<div class="modal-body">
    {{popupModel.text}}
</div>

<div class="modal-footer">
    <button class="btn {{app.setting.theme.primary}}" type="button" ng-click="popupModel.okClick()">{{popupModel.okButton}}</button>
</div>
