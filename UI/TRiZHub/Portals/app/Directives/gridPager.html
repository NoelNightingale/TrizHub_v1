<tr ng-if="vm.Math.floor(vm.gridModel.totalItems/vm.gridModel.recordsPerPage) >= 1">
    <td colspan="5" class="text-center">
        <div class="m-b">
            <nav>
                <ul class="pagination">
                    <li>
                        <a aria-label="Previous" ng-click="vm.previous();">
                            <span aria-hidden="true">&laquo;</span>
                            <span class="sr-only">Previous</span>
                        </a>
                    </li>
                    <li ng-repeat="n in vm.range(1,vm.Math.ceil(vm.gridModel.totalItems/vm.gridModel.recordsPerPage))" ng-class="vm.gridModel.currentPage == n ? 'active':''" ng-click="vm.pageChanged(n)">
                        <a href="#">{{n}}</a>
                    </li>
                    <li>
                        <a aria-label="Next" ng-click="vm.next();">
                            <span aria-hidden="true">&raquo;</span>
                            <span class="sr-only">Next</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </td>
</tr>
