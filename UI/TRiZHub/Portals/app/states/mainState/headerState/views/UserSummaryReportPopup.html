<div class="modal-header {{app.setting.theme.warn}}">
    <h4 class="modal-title">{{popupModel.header}}</h4>
</div>

<div class="modal-body">
    {{popupModel.question}}
    <hr />
    <form role="form" class="form-horizontal">
        <fieldset>
            <div class="form-group">
                <div class="col-sm-2">
                    User:
                </div>

                <div class="col-md-8">
                    <select name="user" class="form-control" ng-options="s.id as s.description for s in vm.filterOptions.users"
                            ng-model="popupModel.userId" ng-required="true" placeholder="User"></select>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-4">
                    Show Inactive Users:
                </div>

                <div class="col-md-8">
                    <p>
                        <label class="md-switch">
                            <input type="checkbox" ng-model="popupModel.showInactive">
                            <i class="indigo"></i>
                        </label>
                    </p>
                </div>
            </div>
        </fieldset>
    </form>
</div>

<div class="modal-footer">
    <button class="btn btn-outline b-{{app.setting.theme.primary}} text-{{app.setting.theme.primary}}" type="button" ng-click="popupModel.noClick()">{{popupModel.noButton}}</button>
    <button class="btn {{app.setting.theme.primary}}" type="button" ng-click="popupModel.yesClick()">{{popupModel.yesButton}}</button>
</div>
