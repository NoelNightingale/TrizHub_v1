<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.clientMaintenance.grid">Client Maintenance</a> / {{vm.viewModel.entityName}}
                </h2>
            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="entityName" class="col-sm-2 form-control-label">Company Name:</label>
                        <div class="col-md-9">
                            <input name="entityName" type="text" class="form-control" ng-model="vm.viewModel.entityName" ng-required="true">
                            <span class="text-help" ng-show="EditForm.entityName.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="active" class="col-sm-2 form-control-label">Is Active:</label>
                        <div class="col-sm-9">
                            <label class="md-switch">
                                <input type="checkbox" ng-model="vm.viewModel.isActive" />
                                <i class="indigo"></i>
                            </label>
                        </div>
                    </div>

                    <hr />

                    <a class="btn btn-xs btn-fw btn-outline b-primary text-primary"
                       ng-show="vm.clientId && vm.isAllowed('UserBillingRatesMaintenance')"
                       ui-sref="mainState.maintenance.clientMaintenance.billingRatesGrid({id: vm.viewModel.id})">
                        <i class="fa fa-usd"></i> Billing Rates
                    </a>

                    <hr />

                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.clientMaintenance.grid">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                    <hr />

                    <div class="form-group row" ng-show="vm.clientId">
                        <label class="col-sm-2 form-control-label">Client Reporters:</label>
                        <div class="col-sm-8">
                            <select name="lineLeader" class="form-control" ng-options="s.id as s.description for s in vm.userDropdown" ng-model="vm.selectedReporter"></select>
                        </div>
                        <div class="col-sm-2">
                            <button class="btn btn-fw primary" ng-click="vm.addReporter()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span>Add
                            </button>
                        </div>
                    </div>

                    <div class="form-group row" ng-repeat="user in vm.clientReporters" ng-show="vm.clientId">
                        <div class="col-sm-2"></div>
                        <label class="col-sm-8 form-control-label">{{user.description}}</label>
                        <div class="col-sm-2">
                            <button class="btn btn-outline b-danger text-danger" ng-click="vm.removeReporter(user.id)">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span>Remove
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>
            </div>
        </div>
    </div>
</div>
