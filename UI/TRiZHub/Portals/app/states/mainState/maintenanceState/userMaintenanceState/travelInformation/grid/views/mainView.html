<div class="row center-container">
<div class="col-sm-12 col-md-12 col-lg-11">
    <div class="padding">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.userMaintenance.detail({id: vm.viewModel.id})">{{vm.user.firstName}} {{vm.user.surName}}</a>/ Travel Information
                </h2>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-5 col-md-3">
                        <form class="form-inline v-m m-b-1" role="search" novalidate>
                            <div class="form-group l-h m-a-0">
                                <div class="input-group input-group-sm">
                                    <input type="text" class="form-control p-x b-a rounded" placeholder="Year" ng-model="vm.gridModel.searchFor">
                                    <span class="input-group-btn">
                                            <button type="submit" class="btn white b-a rounded no-shadow" ng-click="vm.pageGrid.search()"><i class="fa fa-search"></i></button>
                                        </span>

                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <form role="form" name="RecordForm" novalidate>

                        <table st-table="rowCollectionBasic" class="table table-bordered table-striped">
                            <thead>
                            <tr>
                                <th>

                                    <a ng-click="vm.pageGrid.sort('documentType')">Document Type</a>
                                    <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='documentType'}"></i>
                                    <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='documentType'}"></i>
                                </th>
                                <th>
                                    <a ng-click="vm.pagegrid.sort('number')">Number</a>
                                    <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='number'}"></i>
                                    <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='number'}"></i>
                                </th>
                                <th>
                                    <a ng-click="vm.pageGrid.sort('expiryDate')">Expiry Date</a>
                                    <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='expiryDate'}"></i>
                                    <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='expiryDate'}"></i>
                                </th>
                                <th>
                                    <a class="btn btn-xs btn-fw btn-primary" ng-click="vm.newTravelInfo()">
                                        <i class="fa fa-plus"></i> New
                                    </a>
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr data-ng-repeat="i in vm.gridModel.data" st-select-row="row">
                                <td>{{i.documentType}}</td>
                                <td>{{i.number}}</td>
                                <td>{{i.expiryDate | date: 'yyyy/MM/dd'}}</td>

                                <td>
                                    <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.primary}} text-{{app.setting.theme.primary}}"
                                       ui-sref="mainState.maintenance.userMaintenance.travelInformationDetail({id: i.id})">
                                        <i class="fa fa-edit"></i> Edit
                                    </a>

                                    <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.danger}} text-{{app.setting.theme.danger}}"
                                       ng-click="vm.deleteRecord(i)">
                                        <i class="fa fa-delete"></i> Delete
                                    </a>
                                </td>
                            </tr>
                            <tr ng-show="vm.gridModel.data.length == 0">
                                <td colspan="4">
                                    No Records
                                </td>
                            </tr>
                            </tbody>
                            <tfoot>
                            </tfoot>
                        </table>

                    </form>
                    <div class="row">
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
