<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.userMaintenance.officeEquipmentGrid({id: vm.viewModel.userAccountId})">Asset Register</a>
                </h2>
            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>


                    <div class="form-group row" show-errors>
                        <label for="type" class="col-sm-2 form-control-label">Type:</label>
                        <div class="col-sm-9">
                            <input name="type" type="text" ng-model="vm.viewModel.type" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.type.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label class="col-sm-2 form-control-label">Model:</label>
                        <div class="col-sm-9">
                            <input name="model" type="text" ng-model="vm.viewModel.model" class="form-control" />
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="supplierName" class="col-sm-2 form-control-label">Supplier Name:</label>
                        <div class="col-sm-9">
                            <input name="supplierName" type="text" ng-model="vm.viewModel.supplierName" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.supplierName.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="serialNumber" class="col-sm-2 form-control-label">Serial Number:</label>
                        <div class="col-sm-9">
                            <input name="serialNumber" type="text" ng-model="vm.viewModel.serialNumber" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.serialNumber.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="cost" class="col-sm-2 form-control-label">Cost:</label>
                        <div class="col-sm-9">
                            <input name="cost" type="number" ng-model="vm.viewModel.cost" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.cost.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="purchaseDate" class="col-sm-2 form-control-label">Purchase Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.purchaseDate"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="purchaseDate" data-date-format="yyyy/MM/dd"
                                   autoclose="true"
                                   bs-datepicker placeholder="Purchase Date" autocomplete="off">
                            <span class="text-help" ng-show="EditForm.purchaseDate.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="invoiceNumber" class="col-sm-2 form-control-label">Invoice Number:</label>
                        <div class="col-sm-9">
                            <input name="invoiceNumber" type="text" ng-model="vm.viewModel.invoiceNumber" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.invoiceNumber.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="assignedDate" class="col-sm-2 form-control-label">Assigned Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.assignedDate"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="assignedDate" data-date-format="yyyy/MM/dd"
                                   autoclose="true"
                                   bs-datepicker placeholder="Assigned Date" required autocomplete="off">
                            <span class="text-help" ng-show="EditForm.assignedDate.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="returnDate" class="col-sm-2 form-control-label">Returned Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.returnDate"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="returnDate" data-date-format="yyyy/MM/dd"
                                   autoclose="true"
                                   bs-datepicker placeholder="Returned Date" autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="assetRegister" class="col-sm-2 form-control-label">Asset Register Number:</label>
                        <div class="col-sm-9">
                            <input name="assetRegister" type="text" ng-model="vm.viewModel.assetRegister" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.assetRegister.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="notes" class="col-sm-2 form-control-label">Notes</label>
                        <div class="col-sm-9">
                            <textarea name="notes" style="width:100%" rows=5 ng-model="vm.viewModel.notes"></textarea>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="isaccountingitem" class="col-sm-2 form-control-label">Is Accounting Item</label>
                        <div class="col-sm-9">
                            <input name="isaccountingitem" type="checkbox" ng-model="vm.viewModel.isAccountingItem" class="ng-pristine ng-valid ng-empty ng-touched" />
                        </div>
                    </div>
                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.userMaintenance.officeEquipmentGrid({id: vm.viewModel.userAccountId})">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
