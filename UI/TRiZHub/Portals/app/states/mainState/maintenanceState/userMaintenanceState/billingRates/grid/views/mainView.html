<div class="row center-container">
    <div class="col-sm-12 col-md-12 col-lg-11">
        <div class="padding">
            <div class="box">
                <div class="box-header b-b">
                    <h2>
                        <a class="text-success" ui-sref="mainState.maintenance.userMaintenance.detail({id: vm.viewModel.id})">{{vm.user.firstName}} {{vm.user.surName}}</a>/ Billing Rates
                    </h2>
                </div>
                <div class="box-body">
                    <div class="table-responsive">
                        <form role="form" name="RecordForm" novalidate>

                            <table st-table="rowCollectionBasic" class="table table-bordered table-striped">
                                <thead>
                                <tr>
                                    <th>
                                        <a ng-click="vm.pageGrid.sort('Rate')"> Rate</a>
                                        <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='rate'}"></i>
                                        <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='rate'}"></i>
                                    </th>
                                    <th>
                                        <a ng-click="vm.pagegrid.sort('startDate')"> Start Date</a>
                                        <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='startDate'}"></i>
                                        <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='startDate'}"></i>
                                    </th>
                                    <th>
                                        <a ng-click="vm.pageGrid.sort('endDate')">End Date</a>
                                        <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='endDate'}"></i>
                                        <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='endDate'}"></i>
                                    </th>
                                    <!--<th>
                                        <a ng-click="vm.pageGrid.sort('year')">Year</a>
                                        <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='year'}"></i>
                                        <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='year'}"></i>
                                    </th>-->

                                    <th>
                                        <a class="btn btn-xs btn-fw btn-primary" ng-click="vm.newRecord()">
                                            <i class="fa fa-plus"></i> New
                                        </a>
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr data-ng-repeat="i in vm.gridModel.data" st-select-row="row">
                                    <td>{{i.rate}}</td>
                                    <td>{{i.startDate | date: 'yyyy/MM/dd'}}</td>
                                    <td>{{i.endDate | date: 'yyyy/MM/dd'}}</td>
                                    <!--<td>{{i.year}}</td>-->
                                    <td>
                                        <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.primary}} text-{{app.setting.theme.primary}}"
                                           ui-sref="mainState.maintenance.userMaintenance.billingRatesDetail({id: i.id})">
                                            <i class="fa fa-edit"></i> Edit
                                        </a>
                                        <!--<a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.danger}} text-{{app.setting.theme.danger}}"
                                        ng-click="vm.deleteRecord(i)">
                                        <i class="fa fa-delete"></i> Delete
                                        </a>-->

                                    
                                    </td>
                                </tr>
                                <tr ng-show="vm.gridModel.data.length == 0">
                                    <td colspan="4">
                                        No Records
                                    </td>
                                </tr>
                                </tbody>
                                <tfoot>
                                </tfoot>
                            </table>

                        </form>
                        <div class="row">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
