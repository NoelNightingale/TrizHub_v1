<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.userMaintenance.travelInformtionGrid({id: vm.viewModel.userAccountId})">Travel Information</a> / Add
                </h2>
            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="documentType" class="col-sm-2 form-control-label">Document Type:</label>
                        <div class="col-sm-9">
                            <input name="documentType" type="text" ng-model="vm.viewModel.documentType" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.documentType.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="number" class="col-sm-2 form-control-label">Number:</label>
                        <div class="col-sm-9">
                            <input name="number" type="text" ng-model="vm.viewModel.number" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.number.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="expiryDate" class="col-sm-2 form-control-label">Expiry Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.expiryDate"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="date" data-date-format="yyyy/MM/dd"
                                   autoclose="true"
                                   bs-datepicker placeholder="Expiry Date" required autocomplete="off">
                            <span class="text-help" ng-show="EditForm.expiryDate.$invalid">!*</span>
                        </div>
                    </div>

                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.userMaintenance.travelInformtionGrid({id: vm.viewModel.userAccountId})">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
