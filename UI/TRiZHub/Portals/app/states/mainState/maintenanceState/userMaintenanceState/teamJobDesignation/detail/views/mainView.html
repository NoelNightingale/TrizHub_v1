<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.userMaintenance.teamJobDesignationGrid({id: vm.viewModel.userAccountId})">Team and Job Designation</a> / Add
                </h2>
            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="client" class="col-sm-2 form-control-label">Client:</label>
                        <div class="col-sm-9">
                            <select name="client" class="form-control" ng-options="s.id as s.entityName for s in vm.clientDropdown" ng-model="vm.viewModel.clientId" required></select>
                            <span class="text-help" ng-show="EditForm.client.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="lineLeader" class="col-sm-2 form-control-label">Line Leader:</label>
                        <div class="col-sm-9">
                            <select name="lineLeader" class="form-control" ng-options="s.id as s.description for s in vm.userDropdown" ng-model="vm.viewModel.lineLeaderId"></select>
                            <span class="text-help" ng-show="EditForm.lineLeader.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="jobDesignation" class="col-sm-2 form-control-label">Job Designation:</label>
                        <div class="col-sm-9">
                            <input name="jobDesignation" type="text" ng-model="vm.viewModel.jobDesignation" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.jobDesignation.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="location" class="col-sm-2 form-control-label">Employer:</label>
                        <div class="col-sm-9">
                            <select name="location" class="form-control" ng-options="employedBy.id as employedBy.name for employedBy in vm.employedBy" ng-model="vm.viewModel.employerId" required></select>
                            <span class="text-help" ng-show="EditForm.employerId.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="startDate" class="col-sm-2 form-control-label">Start Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.startDate"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="startDate" data-date-format="yyyy/MM/dd"
                                   autoclose="true"
                                   bs-datepicker placeholder="Start Date" required autocomplete="off">
                            <span class="text-help" ng-show="EditForm.startDate.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="endDate" class="col-sm-2 form-control-label">End Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.endDate"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="endDate" data-date-format="yyyy/MM/dd"
                                   autoclose="true"
                                   bs-datepicker placeholder="End Date" autocomplete="off">
                            <span class="text-help" ng-show="EditForm.endDate.$invalid">!*</span>
                        </div>
                    </div>

                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.userMaintenance.teamJobDesignationGrid({id: vm.viewModel.userAccountId})">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>
            </div>
        </div>
    </div>
</div>
