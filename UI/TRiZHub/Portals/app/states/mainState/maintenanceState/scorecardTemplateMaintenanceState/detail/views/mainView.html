<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.scorecardTemplateMaintenance.grid">Scorecard Template Maintenance</a> / {{vm.viewModel.scorecardName}}
                </h2>
           
                </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="scorecardName" class="col-sm-2 form-control-label">Scorecard Name:</label>
                        <div class="col-sm-9">
                            <input name="scorecardName" type="text" class="form-control" ng-model="vm.viewModel.scorecardName" ng-required="true">
                            <span class="text-help" ng-show="EditForm.scorecardName.$invalid">Required</span>
                        </div>
                    </div>
                   
                    <div class="form-group row">
                        <label class="col-sm-2 form-control-label"><span class="text-2x">E </span> Weight:</label>
                        <div class="col-sm-9">
                            <slider name="excellentWeight" ng-model="vm.viewModel.excellentWeight"
                                    floor="0"
                                    ceiling="400"
                                    translate-fn="vm.percentageFormatting"
                                    ng-required="true"
                                  >
                       
                            </slider>
                        </div>
                    </div>
                    <hr />
                    <div class="form-group row">
                        <label class="col-sm-2 form-control-label"><span class="text-2x">A </span> Weight:</label>
                        <div class="col-sm-9">
                            <slider name="adequateWeigh" ng-model="vm.viewModel.adequateWeight"
                                    floor="0"
                                    ceiling="400"
                                    translate-fn="vm.percentageFormatting"
                                    ng-required="true"
                                >
                            </slider>
                        </div>
                    </div>
                    <hr />
                    <div class="form-group row">
                        <label class="col-sm-2 form-control-label"><span class="text-2x">I </span>Weight:</label>
                        <div class="col-sm-9">
                            <slider name="inadequateWeight" ng-model="vm.viewModel.inadequateWeight"
                                    floor="0"
                                    ceiling="400"
                                    translate-fn="vm.percentageFormatting"
                                    ng-required="true">
                                   
                            </slider>
                        </div>
                    </div>
                    <hr />
                    <div class="form-group row">
                        <label for="active" class="col-sm-2 form-control-label">Is Active</label>
                        <div class="col-sm-9">

                            <div class="row">
                                <p>
                                    <label class="md-switch">
                                        <input type="checkbox" ng-model="vm.viewModel.isActive" />
                                        <i class="indigo"></i>
                                    </label>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.scorecardTemplateMaintenance.grid">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
