<div class="row center-container">
    <div class="col-sm-12 col-md-12 col-lg-11">
        <div class="padding">
            <div class="box">
                <div class="box-header b-b">
                    <h2>Scorecard Template Maintenance</h2>
                </div>
                <div class="box-body">
                    <form class="form-group row">
                        <div class="col-sm-12 col-md-4">
                            <div class="input-group input-group-sm">
                                <input type="text" class="form-control p-x b-a rounded" placeholder="Search" ng-model="vm.gridModel.searchFor">
                                <span class="input-group-btn">
                                    <button class="btn white b-a rounded no-shadow" ng-click="vm.pageGrid.search()"><i class="fa fa-search"></i></button>
                                </span>
                            </div>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table st-table="rowCollectionBasic" class="table table-bordered table-striped">
                            <thead>
                            <tr>
                                <th>
                                    <a ng-click="vm.pageGrid.sort('scorecardname')">Scorecard Name</a>
                                    <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='scorecardname'}"></i>
                                    <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='scorecardname'}"></i>
                                </th>
                                <th>
                                    <a ng-click="vm.pageGrid.sort('isactive')">Is Active</a>
                                    <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='isactive'}"></i>
                                    <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='isactive'}"></i>
                                </th>
                                <th>
                                    <a class="btn btn-xs btn-fw btn-primary" ng-click="vm.newScorecardTemplate()">
                                        <i class="fa fa-plus"></i> New
                                    </a>
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr data-ng-repeat="i in vm.gridModel.data" st-select-row="row">
                                <td>{{i.scorecardName}}</td>
                                <td ng-style="i.isActive === true && {'color': 'green'} || i.isActive === false &&{'color' :'red'}"> {{i.isActive}}</td>
                                <td>
                                    <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.primary}} text-{{app.setting.theme.primary}}"
                                       ui-sref="mainState.maintenance.scorecardTemplateMaintenance.detail({id: i.id})">
                                        <i class="fa fa-edit"></i> Edit
                                    </a>
                                    <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.danger}} text-{{app.setting.theme.danger}}" ng-click="vm.deleteTemplate(i)">
                                        <i class="fa fa-remove"></i> Delete
                                    </a>
                                    <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.info}} text-{{app.setting.theme.info}}"
                                       ui-sref="mainState.maintenance.scorecardTemplateItemMaintenance.grid({scorecardTemplateId: i.id})">
                                        <i class="fa fa-reorder"></i> Manage Items
                                    </a>
                                    <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.warn}} text-{{app.setting.theme.warn}}"
                                       ui-sref="mainState.maintenance.scorecardTemplatePeriodMaintenance.grid({scorecardTemplateId: i.id})">
                                        <i class="fa fa-road"></i> Manage Periods
                                    </a>
                                </td>
                            </tr>
                            <tr ng-show="vm.gridModel.data.length == 0">
                                <td colspan="3">
                                    No Records
                                </td>
                            </tr>
                            </tbody>
                            <tfoot>
                            </tfoot>
                        </table>
                        <div class="w-full m-b-2 center-container">
                            <uib-pagination total-items="vm.gridModel.totalItems" ng-model="vm.gridModel.currentPage" max-size="vm.gridModel.maxSize"
                                            class="pagination-sm m-b-sm m-t-sm white" boundary-links="true" previous-text="<" next-text=">" rotate="false" ng-change="vm.pageGrid.pageChanged()" items-per-page="vm.gridModel.recordsPerPage">
                            </uib-pagination>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
