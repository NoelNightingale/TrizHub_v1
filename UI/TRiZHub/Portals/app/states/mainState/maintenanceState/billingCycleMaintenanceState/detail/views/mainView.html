<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.billingCycleMaintenance.grid">Billing Cycle Maintenance</a> /{{vm.viewModel.year}}  {{vm.viewModel.cycle}}
                </h2>


            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="cycle" class="col-sm-2 form-control-label">Cycle:</label>
                        <div class="col-sm-9">
                            <input name="cycle" type="number" ng-model="vm.viewModel.cycle" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.cycle.$invalid">!*</span>
                        </div>
                    </div>



                    <div class="form-group row" show-errors>
                        <label for="startDate" class="col-sm-2 form-control-label">Start Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.startDate"
                                   data-icon-left="fa fa-chevron-left"
                                   autoclose="true"
                                   name="date" data-date-format="yyyy/MM/dd"
                                   data-icon-right="fa fa-chevron-right"
                                   bs-datepicker placeholder="Start Date" required autocomplete="off">
                            <span class="text-help" ng-show="EditForm.startDate.$invalid">!*</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="endDate" class="col-sm-2 form-control-label">End Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.endDate"
                                   data-icon-left="fa fa-chevron-left"
                                   autoclose="true"
                                   data-icon-right="fa fa-chevron-right"
                                   name="date" data-date-format="yyyy/MM/dd"
                                   bs-datepicker placeholder="End Date" required autocomplete="off">
                            <span class="text-help" ng-show="EditForm.endDate.$invalid">!*</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="year" class="col-sm-2 form-control-label">Year:</label>
                        <div class="col-sm-9">
                            <input name="year" type="number" ng-model="vm.viewModel.year" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.year.$invalid">!*</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="weekdays" class="col-sm-2 form-control-label">Weekdays:</label>
                        <div class="col-sm-9">
                            <input name="weekdays" type="number" ng-model="vm.viewModel.weekdays" class="form-control" required />

                            <span class="text-help" ng-show="EditForm.weekdays.$invalid">!*</span>

                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="publicHolidays" class="col-sm-2 form-control-label">Public Holidays:</label>
                        <div class="col-sm-9">
                            <input name="publicHolidays" type="number" ng-model="vm.viewModel.publicHolidays" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.publicHolidays.$invalid">!*</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="workDays" class="col-sm-2 form-control-label">Work Days:</label>
                        <div class="col-sm-9">

                            <input name="workDays" type="number" ng-model="vm.viewModel.workDays" class="form-control" required />
                            <span class="text-help" ng-show="EditForm.workDays.$invalid">!*</span>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="isClosed" class="col-sm-2 form-control-label">Is closed</label>
                        <div class="col-sm-9">
                            <label class="md-switch">
                                <input type="checkbox" ng-model="vm.viewModel.isClosed">
                                <i class="indigo"></i>
                            </label>
                        </div>
                    </div>

                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.billingCycleMaintenance.grid">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.calckWeekDays()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Calculate Weekdays
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.calckWorkDays()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Calculate work days
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
