<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">

                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.scorecardTemplatePeriodMaintenance.grid({scorecardTemplateId: vm.scorecardTemplateId})">Score Card Template Period Maintenance</a> / {{vm.viewModel.scorecardName}} {{vm.viewModel.description}}
                </h2>

            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="description" class="col-sm-2 form-control-label">Description:</label>
                        <div class="col-sm-9">
                            <input name="description" type="text" class="form-control" ng-model="vm.viewModel.description" ng-required="true" autofocus>
                            <span class="text-help" ng-show="EditForm.description.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-2">
                            Variable Date:
                        </div>
                        <div class="col-md-10">
                            <label class="md-switch">
                                <input type="checkbox" ng-model="vm.viewModel.isVariable" ng-change="vm.variableChange()">
                                <i class="indigo"></i>
                            </label>
                        </div>
                    </div>

                    <div class="form-group row" ng-show="!vm.viewModel.isVariable" show-errors>
                        <label for="startdate" class="col-sm-2 form-control-label">Start Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.startDate"
                                   ng-disabled="vm.viewModel.isVariable"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="date" data-date-format="yyyy/MM/dd"
                                   bs-datepicker placeholder="Start Date"
                                   autoclose="true" autocomplete="off">

                            <span class="text-help" ng-show="EditForm.startdate.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" ng-show="!vm.viewModel.isVariable" show-errors>
                        <label for="enddate" class="col-sm-2 form-control-label">End Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.endDate"
                                   ng-disabled="vm.viewModel.isVariable"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="date" data-date-format="yyyy/MM/dd"
                                   bs-datepicker placeholder="End Date"
                                   autoclose="true" autocomplete="off">
                            <span class="text-help" ng-show="EditForm.enddate.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" ng-show="!vm.viewModel.isVariable" show-errors>
                        <label for="reviewYear" class="col-sm-2 form-control-label">Review Year:</label>
                        <div class="col-sm-9">

                            <input type="text" class="form-control"
                                   ng-model="vm.reviewYearDate"
                                   ng-disabled="vm.viewModel.isVariable"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="date" data-date-format="yyyy"
                                   bs-datepicker placeholder="Review Year"
                                   min-view="2"
                                   start-date="vm.today"
                                   autoclose="true" autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label class="col-sm-2 form-control-label">Report Sort Order:</label>
                        <div class="col-sm-9">
                            <input type="number" class="form-control"
                                   name="reportSortOrder"
                                   ng-model="vm.viewModel.reportSortOrder"
                                   ng-required="true">

                            <span class="text-help" ng-show="EditForm.reportSortOrder.$invalid">Required</span>
                        </div>
                    </div>
                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ng-click="vm.cancelForm()">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
