<div class="row center-container">
    <div class="col-sm-12 col-md-12 col-lg-11">
        <div class="padding">
            <div class="box">
                <div class="box-header b-b">
                    <h2>
                        <a class="text-success" ui-sref="mainState.maintenance.projectMaintenance.detail({id: vm.viewModel.id})">{{vm.parentProjectName}} </a>/ Sub Projects
                    </h2>
                </div>
                <div class="box-body">
                    <div class="table-responsive">
                        <form role="form" name="RecordForm" novalidate>

                            <table st-table="rowCollectionBasic" class="table table-bordered table-striped">
                                <thead>
                                    <tr>
                                        <th>
                                            <a ng-click="vm.pageGrid.sort('subProjectNumber')"> Code</a>
                                            <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='subProjectNumber'}"></i>
                                            <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='subProjectNumber'}"></i>
                                        </th>
                                        <th>
                                            <a ng-click="vm.pageGrid.sort('projectName')"> Name</a>
                                            <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='projectName'}"></i>
                                            <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='projectName'}"></i>
                                        </th>
                                        <th>
                                            <a ng-click="vm.pageGrid.sort('isactive')">Is Active</a>
                                            <i ng-class="{'fa fa-angle-double-up':vm.gridModel.sortKeyOrder.order=='ASC' && vm.gridModel.sortKeyOrder.key=='isactive'}"></i>
                                            <i ng-class="{'fa fa-angle-double-down':vm.gridModel.sortKeyOrder.order=='DESC' && vm.gridModel.sortKeyOrder.key=='isactive'}"></i>
                                        </th>
                                        <th>
                                            <a class="btn btn-xs btn-fw btn-primary" ng-click="vm.newRecord()">
                                                <i class="fa fa-plus"></i> New
                                            </a>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr data-ng-repeat="i in vm.gridModel.data" st-select-row="row">
                                        <td>{{i.subProjectNumber}}</td>
                                        <td>{{i.projectName}}</td>
                                        <td ng-style="i.isActive === true && {'color': 'green'} || i.isActive === false &&{'color' :'red'}" ng-show="!i.isDetail">{{i.isActive}}</td>
                                        <td>
                                            <a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.primary}} text-{{app.setting.theme.primary}}"
                                               ui-sref="mainState.maintenance.projectMaintenance.subProjectDetail({id: vm.parentProjectId, subProjectId : i.id})">
                                                <i class="fa fa-edit"></i> Edit
                                            </a>
                                            <!--<a class="btn btn-xs btn-fw btn-outline b-{{app.setting.theme.danger}} text-{{app.setting.theme.danger}}"
                                            ng-click="vm.deleteRecord(i)">
                                            <i class="fa fa-delete"></i> Delete
                                            </a>-->


                                        </td>
                                    </tr>
                                    <tr ng-show="vm.gridModel.data.length == 0">
                                        <td colspan="4">
                                            No Records
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                </tfoot>
                            </table>

                        </form>
                        <div class="row">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
