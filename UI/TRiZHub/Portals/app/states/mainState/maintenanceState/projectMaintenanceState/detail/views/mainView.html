<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.maintenance.projectMaintenance.grid">Project Maintenance</a> / {{vm.viewModel.projectName}}
                </h2>
            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>

                    <div class="form-group row" show-errors>
                        <label for="projectNumber" class="col-sm-2 form-control-label">Project Number:</label>
                        <div class="col-sm-9">
                            <input name="projectNumber" type="text" class="form-control" ng-model="vm.viewModel.projectNumber" ng-required="true">
                            <span class="text-help" ng-show="EditForm.projectNumber.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="projectName" class="col-sm-2 form-control-label">Project Name:</label>
                        <div class="col-sm-9">
                            <input name="projectName" type="text" class="form-control" ng-model="vm.viewModel.projectName" ng-required="true">
                            <span class="text-help" ng-show="EditForm.projectName.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="projectDescription" class="col-sm-2 form-control-label">Project Description:</label>
                        <div class="col-sm-9">
                            <input name="projectDescription" type="text" class="form-control" ng-model="vm.viewModel.projectDescription">
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="client" class="col-sm-2 form-control-label">Client:</label>
                        <div class="col-sm-9">
                            <select name="client" class="form-control" ng-options="s.id as s.entityName for s in vm.clientDropdown" ng-model="vm.viewModel.clientId" ng-required="true"></select>
                            <span class="text-help" ng-show="EditForm.client.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" Show-errors>
                        <label for="projectLead" class="col-sm-2 form-control-label">Project Lead:</label>
                        <div class="col-sm-9">
                            <select name="projectLead" class="form-control" ng-options="s.id as s.description for s in vm.userDropdown" ng-model="vm.viewModel.projectLeadId"></select>
                        </div>
                    </div>

                    <div class="form-group row" Show-errors>
                        <label for="projectLead" class="col-sm-2 form-control-label">Project Type:</label>
                        <div class="col-sm-9">
                            <select name="projectType" class="form-control"
                                    ng-options="s.id as s.name for s in vm.projectTypeDropdown"
                                    ng-model="vm.viewModel.projectTypeId"
                                    ng-change="vm.projectTypeChange()"
                                    ng-required="true"></select>
                            <span class="text-help" ng-show="EditForm.projectType.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-2">
                            Billable:
                        </div>
                        <div class="col-md-9">
                            <label class="md-switch">
                                <input type="checkbox" ng-model="vm.viewModel.billable">
                                <i class="indigo"></i>
                            </label>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-2">
                            Exclude from Timesheet Capture:
                        </div>
                        <div class="col-md-9">
                            <label class="md-switch">
                                <input type="checkbox" ng-model="vm.viewModel.excludeTimeCapture">
                                <i class="indigo"></i>
                            </label>
                        </div>
                    </div>


                    <div class="form-group row">
                        <div class="col-md-2">
                            Is Active:
                        </div>
                        <div class="col-md-9">
                            <label class="md-switch">
                                <input type="checkbox" ng-model="vm.viewModel.isActive">
                                <i class="indigo"></i>
                            </label>
                        </div>
                    </div>

                    <a class="btn btn-xs btn-fw btn-outline b-success text-success"
                       ui-sref="mainState.maintenance.projectMaintenance.subProjectGrid({id: vm.viewModel.id})" ng-show="vm.projectId != null">
                        <i class="fa fa-pencil"></i> Sub Projects
                    </a>
                    <a class="btn btn-xs btn-fw btn-outline b-primary text-primary"
                       ng-show="vm.projectId != null && vm.isAllowed('UserBillingRatesMaintenance')"
                       ui-sref="mainState.maintenance.projectMaintenance.billingRatesGrid({id: vm.viewModel.id})">
                        <i class="fa fa-usd"></i> Billing Rates
                    </a>
                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.maintenance.projectMaintenance.grid">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
