<div class="padding">
    <div class="container">
        <div class="box">
            <div class="box-header b-b">
                <h2>
                    <a class="text-success" ui-sref="mainState.scorecard.grid">Score Cards</a> / Add
                </h2>
            </div>
            <div class="box-body">
                <form role="form" name="EditForm" novalidate>
                    <div class="form-group row" show-errors>
                        <label for="scorecardTemplate" class="col-sm-2 form-control-label">Scorecard Template:</label>
                        <div class="col-sm-9">
                            <select ng-disabled="vm.readOnly" name="scorecardTemplate" class="form-control" ng-options="s.id as s.description for s in vm.filterOptions.scorecardTemplates"
                                    ng-model="vm.viewModel.scorecardTemplateId" ng-required="true" placeholder="Scorecard Template" ng-change="vm.changedScorecardTemplate()"></select>
                            <span class="text-help" ng-show="EditForm.scorecardTemplate.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="scorecardTemplatePeriod" class="col-sm-2 form-control-label">Scorecard Template Period:</label>
                        <div class="col-sm-9">
                            <select ng-disabled="vm.readOnly" name="scorecardTemplatePeriod" class="form-control" ng-options="s.id as s.description for s in vm.filterOptions.scorecardTemplatePeriods"
                                    ng-model="vm.viewModel.scorecardTemplatePeriodId" ng-required="true" placeholder="Scorecard Template Period" ng-change="vm.changedScorecardTemplatePeriod()"></select>
                            <span class="text-help" ng-show="EditForm.scorecardTemplatePeriod.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" ng-show="vm.filterOptions.variablePeriod" show-errors>
                        <label for="startdate" class="col-sm-2 form-control-label">Start Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.variableStart"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="variableStart" data-date-format="yyyy/MM/dd"
                                   bs-datepicker placeholder="Start Date"
                                   autoclose="true" autocomplete="off">

                            <span class="text-help" ng-show="EditForm.variableStart.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" ng-show="vm.filterOptions.variablePeriod" show-errors>
                        <label for="enddate" class="col-sm-2 form-control-label">End Date:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control"
                                   ng-model="vm.viewModel.variableEnd"
                                   data-icon-left="fa fa-chevron-left"
                                   data-icon-right="fa fa-chevron-right"
                                   name="variableEnd" data-date-format="yyyy/MM/dd"
                                   bs-datepicker placeholder="End Date"
                                   autoclose="true" autocomplete="off">
                            <span class="text-help" ng-show="EditForm.variableEnd.$invalid">Required</span>
                        </div>
                    </div>

                    <div class="form-group row" show-errors>
                        <label for="evaluator" class="col-sm-2 form-control-label">Evaluator:</label>
                        <div class="col-sm-9">
                            <select ng-disabled="vm.readOnly" name="evaluator" class="form-control" ng-options="s.id as s.description for s in vm.filterOptions.evaluators"
                                    ng-model="vm.viewModel.evaluatorId" ng-required="true" placeholder="Evaluator"></select>
                            <span class="text-help" ng-show="EditForm.evaluator.$invalid">Required</span>
                        </div>
                    </div>
                    <div class="form-group row" show-errors>
                        <label for="employee" class="col-sm-2 form-control-label">Employee:</label>
                        <div class="col-sm-9">
                            <select ng-disabled="vm.readOnly" name="employee" class="form-control" ng-options="s.id as s.description for s in vm.filterOptions.employees"
                                    ng-model="vm.viewModel.employeeId" ng-required="true" placeholder="Employee"></select>
                            <span class="text-help" ng-show="EditForm.employee.$invalid">Required</span>
                        </div>
                    </div>
                    <hr />
                    <div class="form-group row">
                        <div class="col-md-12 pull-right text-right">
                            <button class="btn btn-outline b-primary text-primary" ui-sref="mainState.scorecard.grid">
                                <span class="glyphicon glyphicon-remove" aria-hidden="true"></span> Cancel
                            </button>
                            <button class="btn btn-fw primary" ng-click="vm.submitForm()">
                                <span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Save
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

        <div class="container">
            <div class="col-md-6 col-md-offset-3">
                <div class="alert alert-danger" ng-if="vm.hasError">{{vm.errorMessage}}</div>
                <div class="alert alert-success" ng-if="vm.saveSuccess">
                    <strong>Success!</strong>
                </div>

            </div>
        </div>
    </div>
</div>
